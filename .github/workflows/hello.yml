name: Premier workflow CI
on:
  push:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher un message
        run: echo "Hello from GitHub Actions CI/CD"
      - name: Afficher la version Python
        run: python --version
      - name: repertoire courant
        run: pwd
      - name: La liste des fichiers presents dans ce repertoire
        run: ls
      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Evenment : $GITHUB_EVENT_NAME"
